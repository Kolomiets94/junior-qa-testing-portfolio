name: Postman API checks
on:
  push:
    paths:
      - 'postman/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run read-only TVmaze fallback checks
        run: npx --yes newman@6.2.1 run postman/tvmaze-fallback.postman_collection.json --timeout-request 15000 --delay-request 500 --reporters cli,json --reporter-json-export reports/newman-results.json
      - name: Save API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-results
          path: reports/newman-results.json
